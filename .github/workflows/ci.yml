name: ci

# Rejoue toute la chaîne sur les données réelles à chaque pull request et sur
# main, puis recompile la note et la publie comme artefact.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  LC_ALL: C.UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: ETL (données réelles CépiDc + INSEE)
        run: |
          python -m etl.download
          python -m etl.transform
          python -m etl.data_quality

      - name: Glossaire CIM-10 à jour
        run: git diff --exit-code GLOSSAIRE_CIM10.md

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Dépendances R
        run: Rscript analysis/install.R
      - name: Standardisation, figures et chiffres de la note (R)
        run: |
          Rscript analysis/standardisation.R
          Rscript analysis/figures.R
          Rscript analysis/chiffres.R

      - name: Compilation de la note (LaTeX)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: report
          root_file: note.tex

      - uses: actions/upload-artifact@v4
        with:
          name: note-mortalite-territoriale
          path: |
            report/note.pdf
            data/processed/provenance.json
            data/processed/rapport_qualite.json
